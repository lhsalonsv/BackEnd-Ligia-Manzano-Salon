spring.application.name=salon-api
spring.config.import=optional:file:.env[.properties]

# Render asigna el puerto en la variable PORT
server.port=${PORT:8080}
# Render termina el HTTPS y reenvía la petición: así Spring sabe que fue https y la IP real
server.forward-headers-strategy=framework

# No mostrar detalles internos en los errores
server.error.include-stacktrace=never
server.error.include-message=never

# Base de datos (Neon)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/El_Salvador'

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Seguridad
seguridad.jwt-secret=${JWT_SECRET}
seguridad.sesion-absoluta=12h
seguridad.inactividad=30m
seguridad.intentos-maximos=5
seguridad.bloqueo=15m
seguridad.cors-origenes=${CORS_ORIGINS}

# Render revisa que la API esté viva en /actuator/health (sin detalles)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
